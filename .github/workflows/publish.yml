name: Publish daily articles

# Fully autonomous: writes 2 SEO/GEO articles a day via the Claude API,
# wires them into the blog + sitemap, commits, and pushes (Railway auto-deploys).
# One-time setup: add repo secret ANTHROPIC_API_KEY (Settings → Secrets → Actions).

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily (03:30 UTC)
  workflow_dispatch: {}     # manual "Run workflow" button for testing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r _generator/requirements.txt

      - name: Generate + wire articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RVP_COUNT: "2"
          RVP_MODEL: "claude-opus-5"
        run: python _generator/generate.py

      - name: Commit + push
        run: |
          git config user.name  "Real Value Bot"
          git config user.email "bot@realvalueportfolio.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-publish articles ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Nothing to publish."
          fi
